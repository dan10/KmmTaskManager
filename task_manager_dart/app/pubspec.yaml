name: task_manager_app
description: Flutter client for Task Manager application
publish_to: "none"
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  logging: ^1.2.0

  # State Management (Flutter Official Recommendation)
  provider: 6.1.5+1
  equatable: ^2.0.7

  # Navigation
  go_router: ^16.2.5

  # HTTP Client
  dio: ^5.9.0
  http: ^1.5.0

  # JSON Serialization
  json_annotation: ^4.9.0

  # UI Components
  flutter_svg: ^2.2.1

  # Local Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Utils
  logger: ^2.6.2
  uuid: ^4.5.1

  # Shared Package
  task_manager_shared:
    path: ../shared
  google_fonts: ^6.3.2
  
  # Pagination
  infinite_scroll_pagination: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Testing
  mockito: ^5.4.4

  # Code Generation
  build_runner: ^2.10.0
  json_serializable: ^6.11.1

  # Linting
  flutter_lints: ^6.0.0

  # Development dependencies
  cupertino_icons: ^1.0.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Generate localization files
  generate: true
