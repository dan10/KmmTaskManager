name: server
description: A server for the task manager application.
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.2

dependencies:
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_cors_headers: ^0.1.5
  task_manager_shared:
    path: ../shared
  postgres: ^3.5.9
  crypto: ^3.0.6
  dart_jsonwebtoken: ^3.3.1
  dotenv: ^4.2.0
  http: ^1.5.0
  uuid: ^4.5.1
  prometheus_client: ^1.0.0+1
  prometheus_client_shelf: ^1.0.0+1

dev_dependencies:
  lints: ^6.0.0
  test: any
  shelf_test_handler: ^2.0.2
